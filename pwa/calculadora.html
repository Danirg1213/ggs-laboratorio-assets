<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d3b">
  <link rel="icon" href="../favicon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>Calculadora de concreto · Agenda GGS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f5; color: #1d2925; font: 1rem Arial, sans-serif; }
    main { max-width: 36rem; margin: auto; padding: 1.25rem; }
    a { color: #0b5d3b; font-weight: bold; }
    h1 { font-size: 1.65rem; }
    form, section { padding: 1rem; border: 1px solid #dbe3df; border-radius: 10px; background: #fff; }
    label { display: block; font-weight: bold; }
    input, select, button { width: 100%; min-height: 44px; border-radius: 6px; font: inherit; }
    input, select { margin-top: .3rem; padding: .5rem; border: 1px solid #74877e; color: inherit; background: #fff; }
    .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .85rem; margin: .85rem 0; }
    .diagrama { display: block; width: 100%; height: auto; margin-top: 1rem; border: 1px solid #dbe3df; border-radius: 8px; }
    .ampliar { display: inline-block; margin-top: .4rem; font-size: .875rem; }
    .campos label[hidden] { display: none; }
    button { padding: .65rem; border: 0; background: #0b5d3b; color: #fff; font-weight: bold; cursor: pointer; }
    section { margin-top: 1rem; background: #eaf4ef; }
    section p { margin: .35rem 0; }
    #total { font-size: 1.45rem; }
    #error { color: #9c2929; }
    #error:empty { display: none; }
  </style>
  <script src="./calculadora.js" defer></script>
</head>
<body>
  <main>
    <a href="./">← Volver a la agenda</a>
    <h1>Calculadora de concreto</h1>
    <form id="calculadora">
      <label>Tipo de elemento
        <select id="tipo">
          <option value="losa">Losa, banqueta o pavimento</option>
          <option value="muro">Muro</option>
          <option value="prisma">Zapata, trabe o columna rectangular</option>
          <option value="cilindro">Columna circular</option>
          <option value="escalera">Escalera recta maciza</option>
          <option value="tubo">Tubo hueco</option>
        </select>
      </label>
      <img id="diagrama" class="diagrama" src="./diagrama-losa.png" width="552" height="278"
        alt="Losa con largo y ancho en planta y espesor vertical.">
      <a id="ampliar" class="ampliar" href="./diagrama-losa.png" target="_blank" rel="noopener">Ampliar diagrama</a>
      <div class="campos" id="dimensiones"></div>
      <div class="campos">
        <label>Cantidad de piezas
          <input id="cantidad" type="number" min="1" step="1" value="1" required>
        </label>
        <label>Desperdicio (%)
          <input id="desperdicio" inputmode="decimal" value="0" required>
        </label>
      </div>
      <p id="error" role="alert"></p>
      <button type="submit">Calcular volumen</button>
    </form>
    <div aria-live="polite" aria-atomic="true">
      <section id="resultado" aria-label="Volumen estimado" hidden>
        <p>Volumen base <strong id="base"></strong></p>
        <p>Volumen adicional <strong id="adicional"></strong></p>
        <p>Total estimado <strong id="total"></strong></p>
      </section>
    </div>
  </main>
</body>
</html>
